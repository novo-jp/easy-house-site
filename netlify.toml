[build]
  publish = "."

# Segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML sempre revalidado — garante que o visitante veja a versão nova
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS/JS: cache de 1 dia + revalidação em segundo plano.
# Os links usam ?v=N, então uma mudança de versão invalida na hora.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Imagens otimizadas têm o tamanho no nome — seguras para cache longo
[[headers]]
  for = "/images/opt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Funil: as functions viram /api/*
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Painel interno não deve ser indexado
[[headers]]
  for = "/admin-taxas"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# O simulador não pode ser cacheado como página estática comum
[[headers]]
  for = "/simular"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
